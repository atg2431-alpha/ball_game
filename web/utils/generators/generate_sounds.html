<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ball Battle SFX Generator</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 40px; }
    h1 { color: #a855f7; }
    button { background: #a855f7; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px 4px; }
    button:hover { background: #9333ea; }
    .sound-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #333; }
    .sound-name { width: 200px; font-weight: bold; }
    .sound-desc { flex: 1; color: #999; font-size: 14px; }
    #status { margin-top: 20px; padding: 16px; background: #222; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🔊 Ball Battle SFX Generator</h1>
  <p>This tool generates all game sound effects using Web Audio API and saves them as WAV files.</p>
  <button onclick="generateAll()">🎵 Generate & Preview All</button>
  <button onclick="downloadAll()">📥 Download All as WAV</button>
  <div id="sound-list"></div>
  <div id="status"></div>

<script>
const SAMPLE_RATE = 44100;

// Sound generator functions - each returns a Float32Array of samples
const SOUNDS = {

  // 1. Ball Collision - heavy thud
  ball_collision: {
    name: 'Ball Collision (Impact Thud)',
    desc: 'Heavy blunt impact when two balls collide',
    generate() {
      const duration = 0.3;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const envelope = Math.exp(-t * 15);
        const freq = 80 + Math.exp(-t * 20) * 120;
        samples[i] = envelope * (
          0.6 * Math.sin(2 * Math.PI * freq * t) +
          0.3 * Math.sin(2 * Math.PI * freq * 1.5 * t) +
          0.2 * (Math.random() * 2 - 1) * Math.exp(-t * 30)
        );
      }
      return samples;
    }
  },

  // 2. Wall Bounce
  wall_bounce: {
    name: 'Wall Bounce',
    desc: 'Snappy bounce when ball hits arena edge',
    generate() {
      const duration = 0.2;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const envelope = Math.exp(-t * 25);
        const freq = 300 + Math.exp(-t * 40) * 400;
        samples[i] = envelope * (
          0.5 * Math.sin(2 * Math.PI * freq * t) +
          0.3 * Math.sin(2 * Math.PI * freq * 2 * t)
        );
      }
      return samples;
    }
  },

  // 3. Sword Slash Hit
  slash_hit: {
    name: 'Slash Hit',
    desc: 'Sharp metallic slash when sword deals damage',
    generate() {
      const duration = 0.35;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const envelope = Math.exp(-t * 12);
        // Noise burst + metallic ring
        const noise = (Math.random() * 2 - 1) * Math.exp(-t * 40);
        const ring = Math.sin(2 * Math.PI * 1200 * t) * Math.exp(-t * 15);
        const low = Math.sin(2 * Math.PI * 150 * t) * Math.exp(-t * 10);
        samples[i] = envelope * (0.5 * noise + 0.3 * ring + 0.2 * low);
      }
      return samples;
    }
  },

  // 4. Gunshot / Projectile Hit
  gunshot: {
    name: 'Gunshot / Projectile Hit',
    desc: 'Punchy shot sound when bullet fires or connects',
    generate() {
      const duration = 0.25;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const click = Math.exp(-t * 80) * 0.8;
        const body = Math.sin(2 * Math.PI * 100 * t) * Math.exp(-t * 20) * 0.4;
        const noise = (Math.random() * 2 - 1) * Math.exp(-t * 50) * 0.5;
        samples[i] = click + body + noise;
      }
      return samples;
    }
  },

  // 5. Explosion (Player Eliminated)
  explosion: {
    name: 'Explosion (Death)',
    desc: 'Dramatic boom when a player is eliminated',
    generate() {
      const duration = 0.8;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const envelope = Math.exp(-t * 4);
        const freq = 40 + Math.exp(-t * 8) * 200;
        const bass = Math.sin(2 * Math.PI * freq * t);
        const noise = (Math.random() * 2 - 1) * Math.exp(-t * 6);
        const crackle = (Math.random() * 2 - 1) * Math.exp(-t * 15) * 0.7;
        samples[i] = envelope * (0.4 * bass + 0.35 * noise + 0.25 * crackle);
      }
      return samples;
    }
  },

  // 6. Weapon Pickup (magic chime)
  weapon_pickup: {
    name: 'Weapon Pickup',
    desc: 'Metallic chime when picking up sword/gun',
    generate() {
      const duration = 0.5;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      const freqs = [523, 659, 784]; // C5, E5, G5 arpeggio
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        let val = 0;
        for (let f = 0; f < freqs.length; f++) {
          const delay = f * 0.06;
          if (t > delay) {
            const lt = t - delay;
            val += Math.sin(2 * Math.PI * freqs[f] * lt) * Math.exp(-lt * 6) * 0.3;
          }
        }
        samples[i] = val;
      }
      return samples;
    }
  },

  // 7. Weapon Expired
  weapon_expired: {
    name: 'Weapon Expired',
    desc: 'Brief click/break when weapon runs out',
    generate() {
      const duration = 0.2;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const click = Math.exp(-t * 60) * 0.5;
        const tone = Math.sin(2 * Math.PI * 400 * t) * Math.exp(-t * 20) * 0.3;
        const tone2 = Math.sin(2 * Math.PI * 300 * t * (1 - t * 2)) * Math.exp(-t * 15) * 0.3;
        samples[i] = click + tone + tone2;
      }
      return samples;
    }
  },

  // 8. Power-up Spawn
  powerup_spawn: {
    name: 'Power-up Spawn',
    desc: 'Gentle sparkle when power-up appears on board',
    generate() {
      const duration = 0.4;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const env = Math.sin(Math.PI * t / 0.4) * 0.4;
        const freq = 800 + Math.sin(t * 20) * 200;
        samples[i] = env * (
          0.5 * Math.sin(2 * Math.PI * freq * t) +
          0.3 * Math.sin(2 * Math.PI * freq * 1.5 * t) +
          0.1 * (Math.random() * 2 - 1)
        );
      }
      return samples;
    }
  },

  // 9. Power-up Pickup
  powerup_pickup: {
    name: 'Power-up Pickup',
    desc: 'Rewarding ascending chime when grabbing a power-up',
    generate() {
      const duration = 0.45;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const freq = 400 + t * 1600; // ascending sweep
        const envelope = Math.exp(-t * 3) * Math.sin(Math.PI * t / 0.45);
        samples[i] = envelope * (
          0.5 * Math.sin(2 * Math.PI * freq * t) +
          0.3 * Math.sin(2 * Math.PI * freq * 2 * t)
        );
      }
      return samples;
    }
  },

  // 10. Status Applied (buff/debuff)
  status_applied: {
    name: 'Status Applied',
    desc: 'Magic shimmer when a status effect is applied',
    generate() {
      const duration = 0.5;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const env = Math.exp(-t * 4);
        const mod = Math.sin(2 * Math.PI * 6 * t); // tremolo
        const freq = 600 + mod * 100;
        samples[i] = env * 0.4 * (
          Math.sin(2 * Math.PI * freq * t) +
          0.5 * Math.sin(2 * Math.PI * freq * 1.5 * t)
        ) * (0.7 + 0.3 * mod);
      }
      return samples;
    }
  },

  // 11. Power-down (shared: POWERUP_EXPIRED + STATUS_EXPIRED)
  power_down: {
    name: 'Power Down',
    desc: 'Descending tone when power-up or status expires',
    generate() {
      const duration = 0.4;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const freq = 600 - t * 1000; // descending sweep
        const envelope = Math.exp(-t * 5);
        samples[i] = envelope * 0.4 * Math.sin(2 * Math.PI * Math.max(freq, 100) * t);
      }
      return samples;
    }
  },

  // 12. Arena Shrink (ominous drone - short loop sample)
  arena_shrink: {
    name: 'Arena Shrink',
    desc: 'Ominous low rumble when the safe zone contracts',
    generate() {
      const duration = 1.0;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const env = 0.3 * Math.sin(Math.PI * t / 1.0); // smooth fade in/out for looping
        const bass = Math.sin(2 * Math.PI * 45 * t);
        const sub = Math.sin(2 * Math.PI * 30 * t + Math.sin(2 * Math.PI * 0.5 * t));
        const rumble = (Math.random() * 2 - 1) * 0.15;
        samples[i] = env * (0.5 * bass + 0.3 * sub + 0.2 * rumble);
      }
      return samples;
    }
  },

  // 13. Hazard Trigger (whoosh/spring)
  hazard_trigger: {
    name: 'Hazard Trigger',
    desc: 'Whoosh/spring when a trap activates',
    generate() {
      const duration = 0.35;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const freq = 200 + Math.exp(-t * 10) * 2000;
        const envelope = Math.exp(-t * 8);
        const noise = (Math.random() * 2 - 1) * Math.exp(-t * 12);
        samples[i] = envelope * (
          0.5 * Math.sin(2 * Math.PI * freq * t) +
          0.3 * noise
        );
      }
      return samples;
    }
  },

  // 14. Game Start
  game_start: {
    name: 'Game Start',
    desc: 'Energetic fanfare when match begins',
    generate() {
      const duration = 0.6;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      const notes = [
        { freq: 523, start: 0.0, dur: 0.15 },   // C5
        { freq: 659, start: 0.1, dur: 0.15 },   // E5
        { freq: 784, start: 0.2, dur: 0.15 },   // G5
        { freq: 1047, start: 0.3, dur: 0.3 },   // C6 (held)
      ];
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        let val = 0;
        for (const note of notes) {
          if (t >= note.start && t < note.start + note.dur) {
            const lt = t - note.start;
            const env = Math.exp(-lt * 4) * 0.35;
            val += env * (
              Math.sin(2 * Math.PI * note.freq * lt) +
              0.3 * Math.sin(2 * Math.PI * note.freq * 2 * lt)
            );
          }
        }
        samples[i] = val;
      }
      return samples;
    }
  },

  // 15. Game Over
  game_over: {
    name: 'Game Over',
    desc: 'Dramatic descending chords when match ends',
    generate() {
      const duration = 1.0;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      const chords = [
        { freqs: [392, 494, 587], start: 0.0 },  // G-B-D
        { freqs: [349, 440, 523], start: 0.3 },  // F-A-C
        { freqs: [262, 330, 392], start: 0.6 },  // C-E-G (resolve)
      ];
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        let val = 0;
        for (const chord of chords) {
          if (t >= chord.start) {
            const lt = t - chord.start;
            const env = Math.exp(-lt * 2.5) * 0.2;
            for (const freq of chord.freqs) {
              val += env * Math.sin(2 * Math.PI * freq * lt);
            }
          }
        }
        samples[i] = val;
      }
      return samples;
    }
  },

  // 16. UI Click
  ui_click: {
    name: 'UI Click',
    desc: 'Short soft click for buttons and toggles',
    generate() {
      const duration = 0.08;
      const samples = new Float32Array(SAMPLE_RATE * duration);
      for (let i = 0; i < samples.length; i++) {
        const t = i / SAMPLE_RATE;
        const click = Math.exp(-t * 100) * 0.6;
        const tone = Math.sin(2 * Math.PI * 1000 * t) * Math.exp(-t * 60) * 0.3;
        samples[i] = click + tone;
      }
      return samples;
    }
  },
};

// Convert Float32Array to WAV blob
function floatToWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  // WAV header
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true); // chunk size
  view.setUint16(20, 1, true);  // PCM
  view.setUint16(22, 1, true);  // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true); // byte rate
  view.setUint16(32, 2, true);  // block align
  view.setUint16(34, 16, true); // bits per sample
  writeString(36, 'data');
  view.setUint32(40, samples.length * 2, true);

  // Convert float samples to 16-bit PCM
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s * 0x7FFF, true);
  }

  return new Blob([buffer], { type: 'audio/wav' });
}

// Preview a sound
function previewSound(key) {
  const ctx = new AudioContext();
  const samples = SOUNDS[key].generate();
  const buffer = ctx.createBuffer(1, samples.length, SAMPLE_RATE);
  buffer.getChannelData(0).set(samples);
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  source.start();
}

// Generate all and show list
function generateAll() {
  const list = document.getElementById('sound-list');
  list.innerHTML = '';
  for (const [key, sound] of Object.entries(SOUNDS)) {
    const row = document.createElement('div');
    row.className = 'sound-row';
    row.innerHTML = `
      <span class="sound-name">${sound.name}</span>
      <span class="sound-desc">${sound.desc}</span>
      <button onclick="previewSound('${key}')">▶ Play</button>
      <button onclick="downloadOne('${key}')">💾 Save</button>
    `;
    list.appendChild(row);
  }
  document.getElementById('status').textContent = '✅ All 16 sounds generated. Click Play to preview or Download All to save.';
}

// Download single sound
function downloadOne(key) {
  const samples = SOUNDS[key].generate();
  const blob = floatToWav(samples, SAMPLE_RATE);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${key}.wav`;
  a.click();
  URL.revokeObjectURL(url);
}

// Download all sounds
async function downloadAll() {
  const status = document.getElementById('status');
  status.textContent = '⏳ Generating and downloading all sounds...';

  for (const [key, sound] of Object.entries(SOUNDS)) {
    const samples = sound.generate();
    const blob = floatToWav(samples, SAMPLE_RATE);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${key}.wav`;
    a.click();
    URL.revokeObjectURL(url);
    // Small delay to avoid browser blocking
    await new Promise(r => setTimeout(r, 300));
  }

  status.textContent = '✅ All 16 WAV files downloaded! Move them to your web/audio/ folder.';
}
</script>
</body>
</html>
