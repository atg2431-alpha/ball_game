<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ball Battle Simulator - An arena-style ball fighting game">
  <title>Ball Battle Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Theme Toggle -->
  <button id="theme-toggle" class="btn-theme" title="Toggle Light/Dark Mode">
    ☀️
  </button>

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar-wrapper" style="display: flex; flex-direction: column; gap: 16px;">
      <aside class="sidebar">
        <div class="sidebar-tabs">
          <button class="btn-tab btn-tab--active" data-target="tab-shape">SHAPE</button>
          <button class="btn-tab" data-target="tab-weapon">WEAPON</button>
        </div>

      <!-- SHAPE TAB -->
      <div id="tab-shape" class="tab-content active">
        <div class="shape-options">
          <button class="btn-shape btn-shape--active" data-shape="rectangle">
            <div class="shape-icon shape-icon--rect"></div>
            Rectangle
          </button>
          <button class="btn-shape" data-shape="circle">
            <div class="shape-icon shape-icon--circle"></div>
            Circle
          </button>
        </div>
      </div>

      <!-- WEAPON TAB -->
      <div id="tab-weapon" class="tab-content">
        <div class="shape-options">
          
          <!-- Sword -->
          <div class="weapon-row">
            <div class="weapon-main" style="display: flex; gap: 8px;">
              <button class="btn-weapon btn-weapon--active" data-weapon="sword" style="flex: 1;">
                <div class="shape-icon shape-icon--sword">⚔️</div>
                Sword
              </button>
              <button class="btn-settings-toggle" data-target="sword-settings" title="Weapon Settings">⚙️</button>
            </div>
            <div class="weapon-settings" id="sword-settings" style="display: none;">
              <label class="setting-row"><span>Spawn (s)</span><input type="number" id="sword-spawn" class="setting-input" value="10" min="1"></label>
              <label class="setting-row"><span>Duration (s)</span><input type="number" id="sword-duration" class="setting-input" value="5" min="1"></label>
            </div>
          </div>

          <!-- Long Sword -->
          <div class="weapon-row">
            <div class="weapon-main" style="display: flex; gap: 8px;">
              <button class="btn-weapon" data-weapon="longsword" style="flex: 1;">
                <div class="shape-icon shape-icon--sword">🗡️</div>
                Long Sword
              </button>
              <button class="btn-settings-toggle" data-target="longsword-settings" title="Weapon Settings">⚙️</button>
            </div>
            <div class="weapon-settings" id="longsword-settings" style="display: none;">
              <label class="setting-row"><span>Spawn (s)</span><input type="number" id="longsword-spawn" class="setting-input" value="10" min="1"></label>
              <label class="setting-row"><span>Duration (s)</span><input type="number" id="longsword-duration" class="setting-input" value="5" min="1"></label>
            </div>
          </div>

          <!-- Gun -->
          <div class="weapon-row">
            <div class="weapon-main" style="display: flex; gap: 8px;">
              <button class="btn-weapon" data-weapon="gun" style="flex: 1;">
                <div class="shape-icon shape-icon--sword">🔫</div>
                Gun
              </button>
              <button class="btn-settings-toggle" data-target="gun-settings" title="Weapon Settings">⚙️</button>
            </div>
            <div class="weapon-settings" id="gun-settings" style="display: none;">
              <label class="setting-row"><span>Spawn (s)</span><input type="number" id="gun-spawn" class="setting-input" value="12" min="1"></label>
              <label class="setting-row"><span>Duration (s)</span><input type="number" id="gun-duration" class="setting-input" value="6" min="1"></label>
              <label class="setting-row"><span>Fire Rate (s)</span><input type="number" id="gun-fire-rate" class="setting-input" value="1" min="1"></label>
              <label class="setting-row"><span>Bullet Life (s)</span><input type="number" id="gun-bullet-life" class="setting-input" value="2" min="1"></label>
            </div>
          </div>

        </div>
      </aside>

      <!-- PHASE 2: MODIFIERS PANEL -->
      <aside class="sidebar modifiers-sidebar">
        <h3 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px;">⚡ Modifiers</h3>
        
        <label class="toggle-container" title="Enable Power-ups">
          <span class="toggle-label">Power-ups</span>
          <div class="toggle-switch">
            <input type="checkbox" id="powerup-toggle">
            <span class="slider"></span>
          </div>
        </label>

        <label class="toggle-container" title="Enable Arena Shrink">
          <span class="toggle-label">Arena Shrink</span>
          <div class="toggle-switch">
            <input type="checkbox" id="shrink-toggle">
            <span class="slider"></span>
          </div>
        </label>

        <label class="toggle-container" title="Enable Gravity Wells">
          <span class="toggle-label">Gravity Wells</span>
          <div class="toggle-switch">
            <input type="checkbox" id="gravity-toggle">
            <span class="slider"></span>
          </div>
        </label>

        <label class="toggle-container" title="Enable Bounce Pads">
          <span class="toggle-label">Bounce Pads</span>
          <div class="toggle-switch">
            <input type="checkbox" id="bounce-toggle">
            <span class="slider"></span>
          </div>
        </label>

        <label class="toggle-container" title="Enable Sound Effects">
          <span class="toggle-label">Sound FX</span>
          <div class="toggle-switch">
            <input type="checkbox" id="sound-toggle">
            <span class="slider"></span>
          </div>
        </label>

        <p class="recording-desc" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 12px; line-height: 1.4;">
          Toggle game modifiers before starting a match. Power-ups spawn randomly on the arena.
        </p>
      </aside>

      <!-- RECORDING PANEL -->
      <aside class="sidebar recording-sidebar">
        <div class="recording-options">
          <label class="toggle-container" title="Enable Screen Recording">
            <span class="toggle-label">Record Match</span>
            <div class="toggle-switch">
              <input type="checkbox" id="record-toggle">
              <span class="slider"></span>
            </div>
          </label>
          <p class="recording-desc" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; line-height: 1.4;">
            When enabled, the match will be automatically recorded and saved as a video file when it ends.
          </p>
        </div>
      </aside>
    </div>

    <div class="game-wrapper">
    <h1 class="game-title">Ball Battle Simulator</h1>

    <!-- Player Labels -->
    <div class="player-labels">
      <div class="player-label player-label--blue">
        <span class="player-label__name">Player 1</span>
      </div>
      <div class="versus-badge">VS</div>
      <div class="player-label player-label--red">
        <span class="player-label__name">Player 2</span>
      </div>
    </div>

    <!-- Board + Controls -->
    <div class="board-container">
      <!-- Game Board / Arena -->
    <div class="board" id="game-board">
      <!-- Board background image can be set via CSS or JS later -->
      <div class="board__inner">
        <canvas id="game-canvas"></canvas>
      </div>
    </div>

      <!-- Controls -->
      <div class="controls">
        <div class="speed-controls" id="speed-controls">
          <button class="btn-speed active" data-speed="1">1x</button>
          <button class="btn-speed" data-speed="2">2x</button>
          <button class="btn-speed" data-speed="4">4x</button>
        </div>
        <button class="btn-start" id="start-btn" title="Start Simulation">▶</button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stats-card stats-card--blue">
        <span class="stats-card__label">HP</span>
        <input type="number" class="stats-card__input stats-card__value--blue" id="ball-1-hp" value="100" min="0" step="1">
      </div>
      <div class="stats-card stats-card--red">
        <span class="stats-card__label">HP</span>
        <input type="number" class="stats-card__input stats-card__value--red" id="ball-2-hp" value="100" min="0" step="1">
      </div>
    </div>
    <!-- Error Display -->
    <div id="error-log" style="color: red; background: #222; padding: 10px; width: 100%; font-family: monospace; z-index: 100; position: absolute; top: 0; left: 0; display: none;"></div>
  </div>

  <!-- Game Over Screen -->
  <div class="game-over-overlay" id="game-over-screen">
    <div class="game-over-card">
      <h2 class="game-over-title">GAME OVER</h2>
      <p class="game-over-winner" id="winner-text">Player Wins!</p>
      <button class="btn-primary" id="play-again-btn">Play Again</button>
    </div>
  </div>
  
  <script>
    window.addEventListener('error', function(e) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML += e.message + '<br>' + e.filename + ':' + e.lineno + '<br>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML += 'Promise rejection: ' + e.reason + '<br>';
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
